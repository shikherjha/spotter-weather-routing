[project]
name = "spotter-backend"
version = "0.1.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.7.3",
    "h3>=4.5.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyproj>=3.8.0",
    "redis>=5",
    "shapely>=2.2.0",
    "tenacity>=9.2.1",
    "timezonefinder>=9.2.0",
    "typesafe-sdk>=0.7.5",
    "uvicorn[standard]>=0.54.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["h3.*", "shapely.*", "pyproj.*", "polyline.*", "timezonefinder.*", "dj_database_url.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
